<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>实验室设备看板</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><span class="mark">研管</span><div><h1>实验室设备看板</h1><p>课题组内部页面</p></div></header><section id="unlock" class="panel unlock"><h2>输入访问密码</h2><p>与 Student Tasks、LabRules 使用同一访问密码，密码不会发送到服务器。</p><form id="unlockForm"><input id="password" type="password" autocomplete="current-password" placeholder="访问密码" required><button type="submit">查看设备</button></form><p id="message" class="message" role="alert"></p></section><section id="board" hidden><div class="board-head"><div><h2 id="title">实验室设备看板</h2><p id="updatedAt"></p></div><button id="lock" class="secondary">锁定</button></div><div class="panel"><div class="filters"><input id="search" placeholder="搜索设备、型号、位置或负责人"><select id="status"><option value="">全部状态</option><option>正常</option><option>借出</option><option>维修</option><option>停用</option><option>遗失待查</option></select></div><div class="table-wrap"><table><thead><tr><th>序号</th><th>仪器设备</th><th>具体型号、数量</th><th>位置</th><th>现负责人</th><th>状态</th><th>备注</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty" hidden>没有符合条件的设备。</p></div></section></main><script src="app.js"></script></body></html>
