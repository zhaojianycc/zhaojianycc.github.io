<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Student Info</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><span class="mark">研管</span><div><h1>Student Info</h1><p>学生公共服务、工位、邮箱与参与项目</p></div></header><section id="unlock" class="panel unlock"><h2>输入访问密码</h2><p>与 Student Tasks、Lab Rules 使用同一访问密码。</p><form id="unlockForm"><input id="password" type="password" autocomplete="current-password" placeholder="访问密码" required><button type="submit">查看信息</button></form><p id="message" class="message" role="alert"></p></section><section id="info" hidden><div class="board-head"><div><h2 id="title">Student Info</h2><p id="updatedAt"></p></div><button id="lock" class="secondary">锁定</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>学生姓名</th><th>学生邮箱</th><th>公共服务</th><th>工位</th><th>参与项目</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><script src="app.js"></script></body></html>
